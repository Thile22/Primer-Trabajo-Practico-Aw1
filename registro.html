<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro - THITEC</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="login-container">

    <form class="formulario">

      <h2>Crear cuenta</h2>

      <div class="campo">
        <label>Nombre</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Email</label>
        <input type="email">
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password">
      </div>

      <button type="submit">
        Registrarse
      </button>

      <p class="texto-registro">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>

    </form>

  </div>

</body>

</html>
